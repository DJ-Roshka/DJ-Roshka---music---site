<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remix Cloud | Твоё Имя</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 50px;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: -1px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .track-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px border rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s;
        }

        .track-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }

        .track-info h3 { margin: 0; color: #00d2ff; }
        .track-info p { margin: 5px 0 0; opacity: 0.7; font-size: 0.9rem; }

        audio {
            height: 35px;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
        }

        .badge {
            background: #3a7bd5;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>REMIXER NAME</h1>
        <p>Multi-genre Edits & Official Remixes</p>
    </header>

    <div class="container">
        <div class="track-card">
            <div class="track-info">
                <span class="badge">House / Pop</span>
                <h3>Dua Lipa - Training Season (Remix)</h3>
                <p>2024 Bootleg</p>
            </div>
            <audio controls>
                <source src="ссылка_на_твой_файл.mp3" type="audio/mpeg">
                Твой браузер не поддерживает аудио.
            </audio>
        </div>

        <div class="track-card">
            <div class="track-info">
                <span class="badge">Techno</span>
                <h3>The Weeknd - Blinding Lights (Techno Edit)</h3>
                <p>Private Remix</p>
            </div>
            <audio controls>
                <source src="ссылка_на_твой_файл_2.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

</body>
</html>
